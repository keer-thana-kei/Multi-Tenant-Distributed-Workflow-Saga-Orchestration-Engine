version: "3.9"

networks:
  workflow-net:
    name: workflow-net
    driver: bridge

services:
  # ── Redis (Shared message broker) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - workflow-net

  # ── API Server ────────────────────────────────────────────────────────
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ROLE: api
      PORT: "5000"
      REDIS_URL: redis://redis:6379
      ENABLE_MOCK: "true"
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - workflow-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Background Worker ─────────────────────────────────────────────────
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ROLE: worker
      PORT: "5000"
      REDIS_URL: redis://redis:6379
      RECOVER_ON_START: "false"
      WORKER_CONCURRENCY: "50"
      ENABLE_MOCK: "true"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - workflow-net

  # ── Legacy Backend (single-process mode) ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: workflow-engine-backend:latest
    container_name: workflow-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    networks:
      - workflow-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles:
      - legacy

  # ── Monitoring Service ───────────────────────────────────────────────────
  monitoring:
    build:
      context: ./Monitoring
      dockerfile: Dockerfile
    image: workflow-engine-monitoring:latest
    container_name: workflow-monitoring
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      BACKEND_URL: "http://api:5000"
      HEALTH_CHECK_INTERVAL: "30"
      CPU_ALERT_THRESHOLD: "80"
      MEMORY_ALERT_THRESHOLD: "85"
      FAILURE_RATE_THRESHOLD: "30"
      WORKER_STALL_MINUTES: "10"
    env_file:
      - ./Monitoring/.env   # uses MONITORING_MONGODB_URI (read-only) or falls back to MONGODB_URI
      - ./backend/.env      # shares MONGODB_URI as fallback
    depends_on:
      api:
        condition: service_healthy
    networks:
      - workflow-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ── Prometheus (Observability & Scraper) ──────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: workflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./Monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./Monitoring/alerts/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - monitoring
    networks:
      - workflow-net

  # ── Grafana (Dashboards & Visualization) ──────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: workflow-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./Monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./Monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - workflow-net

volumes:
  prometheus-data:
  grafana-data:
