# Alertmanager Configuration for Multi-Tenant Workflow Saga Engine
#
# IMPORTANT SECURITY NOTICE:
# Credentials, API keys, and webhook endpoints are referenced securely via
# environment variables or secret mounts. NO hardcoded secrets are stored here.

global:
  resolve_timeout: 5m
  # SMTP configuration referencing environment variables
  smtp_smarthost: '${SMTP_SMARTHOST:-localhost:25}'
  smtp_from: '${ALERT_EMAIL_FROM:-alerts@workflow-engine.local}'
  smtp_auth_username: '${SMTP_AUTH_USERNAME:-}'
  smtp_auth_password: '${SMTP_AUTH_PASSWORD:-}'
  smtp_require_tls: false

# Route tree defining alert grouping and dispatch
route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-webhook'

  routes:
    # Critical alerts route immediately to on-call pager / webhook
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts route to standard operations channel
    - match:
        severity: warning
      receiver: 'ops-channel'
      repeat_interval: 8h

# Inhibition rules: suppress warnings if a critical alert for the same service is already active
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service']

# Receivers configuration
receivers:
  # ── Default Webhook ─────────────────────────────────────────────────────────
  - name: 'default-webhook'
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL:-http://localhost:4000/alerts/webhook}'
        send_resolved: true
        http_config:
          bearer_token: '${ALERT_WEBHOOK_BEARER_TOKEN:-}'

  # ── Critical Alerts (PagerDuty / Slack / Webhook) ───────────────────────────
  - name: 'critical-alerts'
    webhook_configs:
      - url: '${CRITICAL_WEBHOOK_URL:-http://localhost:4000/alerts/webhook}'
        send_resolved: true
        http_config:
          bearer_token: '${CRITICAL_WEBHOOK_BEARER_TOKEN:-}'
    slack_configs:
      - channel: '${SLACK_CRITICAL_CHANNEL:-#saga-alerts-critical}'
        api_url: '${SLACK_API_URL:-https://hooks.slack.com/services/REDACTED}'
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'

  # ── Operations Channel (Slack / Email) ──────────────────────────────────────
  - name: 'ops-channel'
    email_configs:
      - to: '${OPS_EMAIL_TO:-ops-team@workflow-engine.local}'
        send_resolved: true
