apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-deployment
  namespace: workflow-engine
  labels:
    app: workflow-alertmanager
    app.kubernetes.io/name: workflow-alertmanager
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/part-of: workflow-saga-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: workflow-alertmanager
  template:
    metadata:
      labels:
        app: workflow-alertmanager
        app.kubernetes.io/name: workflow-alertmanager
        app.kubernetes.io/component: alert-router
        app.kubernetes.io/part-of: workflow-saga-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
            - '--web.listen-address=0.0.0.0:9093'
          ports:
            - name: mesh
              containerPort: 9093
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/ready
              port: mesh
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: mesh
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: storage
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: storage
          persistentVolumeClaim:
            claimName: alertmanager-storage-pvc
      restartPolicy: Always
