# =============================================================================
# Kubernetes Secret Template for Monitoring Service
#
# IMPORTANT SECURITY NOTICE:
# DO NOT COMMIT REAL CREDENTIALS TO SOURCE CONTROL.
# In production, use one of the following approaches:
#   1. External Secrets Operator (AWS Secrets Manager, GCP Secret Manager, Vault)
#   2. Bitnami Sealed Secrets (encrypted secrets committed to Git)
#   3. Manual/CI injection:
#        kubectl create secret generic monitoring-secrets \
#          --namespace=workflow-engine \
#          --from-literal=MONGODB_URI="mongodb+srv://..." \
#          --from-literal=JWT_SECRET="..." \
#          --from-literal=MONITORING_API_KEY="..." \
#          --dry-run=client -o yaml | kubectl apply -f -
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secrets
  namespace: workflow-engine
  labels:
    app.kubernetes.io/name: workflow-monitoring
    app.kubernetes.io/part-of: workflow-saga-engine
type: Opaque
stringData:
  # Replace these template values before applying to your cluster
  MONGODB_URI: "mongodb+srv://PLACEHOLDER_USER:PLACEHOLDER_PASSWORD@PLACEHOLDER_CLUSTER.mongodb.net/"
  JWT_SECRET: "PLACEHOLDER_JWT_SECRET_REPLACE_IN_PRODUCTION"
  MONITORING_API_KEY: "PLACEHOLDER_API_KEY_REPLACE_IN_PRODUCTION"
