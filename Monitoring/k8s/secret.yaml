# IMPORTANT: Replace <base64-encoded-value> with the actual base64-encoded
# MongoDB URI before applying to your cluster.
# Encode with: echo -n "mongodb+srv://..." | base64
#
# DO NOT commit actual credentials to source control.
# Use a secrets manager (e.g. AWS Secrets Manager, GCP Secret Manager,
# HashiCorp Vault) in production environments.
#
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secrets
  namespace: workflow-engine
type: Opaque
data:
  # base64-encoded MONGODB_URI — replace this placeholder value
  MONGODB_URI: "<base64-encoded-mongodb-uri>"
