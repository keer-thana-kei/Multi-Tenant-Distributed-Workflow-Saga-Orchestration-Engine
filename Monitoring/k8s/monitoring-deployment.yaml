apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-deployment
  namespace: workflow-engine
  labels:
    app: workflow-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-monitoring
  template:
    metadata:
      labels:
        app: workflow-monitoring
    spec:
      containers:
        - name: monitoring
          image: workflow-engine-monitoring:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: monitoring-config
            - secretRef:
                name: monitoring-secrets
          # Liveness probe — restart container if /health stops responding
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe — only route traffic once /health responds OK
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
