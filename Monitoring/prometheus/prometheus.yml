# Prometheus Configuration for Multi-Tenant Distributed Workflow Saga Engine
# Scrapes monitoring metrics and backend health endpoints

global:
  scrape_interval: 15s      # How frequently to scrape targets
  evaluation_interval: 15s  # How frequently to evaluate alert rules
  scrape_timeout: 10s       # Timeout per scrape request

# Alertmanager configuration
alerting:
  alertmanagers:
    - scheme: http
      timeout: 10s
      static_configs:
        - targets:
            - 'localhost:9093'
            - 'alertmanager:9093'

# Rule files containing PromQL alerting rules
rule_files:
  - '../alerts/alert_rules.yml'
  - '/etc/prometheus/alert_rules.yml'
  - 'alert_rules.yml'

# Scrape configurations
scrape_configs:
  # ── 1. Monitoring Service (Port 4000) ───────────────────────────────────────
  # Scrapes Prometheus exposition format from /metrics
  - job_name: 'monitoring-service'
    metrics_path: '/metrics'
    scheme: http
    params:
      format: ['prometheus']
    # Bearer token for protected metrics endpoint
    authorization:
      type: 'Bearer'
      credentials: 'wf-engine-s3cr3t-jwt-k3y-change-in-production'
    static_configs:
      - targets:
          - 'localhost:4000'
          - 'host.docker.internal:4000'
          - 'workflow-monitoring:4000'
        labels:
          environment: 'production'
          service: 'monitoring-service'
          app: 'saga-orchestrator'

  # ── 2. Workflow Backend Service (Port 5000) ─────────────────────────────────
  # Scrapes actual backend health probe endpoint (/health)
  - job_name: 'workflow-backend'
    metrics_path: '/health'
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 'localhost:5000'
          - 'host.docker.internal:5000'
          - 'workflow-backend:5000'
        labels:
          environment: 'production'
          service: 'workflow-backend'
          app: 'saga-orchestrator'
