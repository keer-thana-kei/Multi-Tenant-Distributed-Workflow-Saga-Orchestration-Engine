# Secret is created by hand, never committed:
# kubectl create secret generic engine-env --from-env-file=backend/.env
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: engine-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: engine-api } }
  template:
    metadata: { labels: { app: engine-api } }
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/workflow-engine:latest
          ports: [{ containerPort: 5000 }]
          envFrom: [{ secretRef: { name: engine-env } }]
          env:
            - { name: ROLE, value: "api" }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: ENABLE_MOCK, value: "false" }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: engine-api }
spec:
  type: LoadBalancer
  selector: { app: engine-api }
  ports: [{ port: 80, targetPort: 5000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: engine-worker }
spec:
  replicas: 2
  selector: { matchLabels: { app: engine-worker } }
  template:
    metadata: { labels: { app: engine-worker } }
    spec:
      containers:
        - name: worker
          image: YOUR_REGISTRY/workflow-engine:latest
          envFrom: [{ secretRef: { name: engine-env } }]
          env:
            - { name: ROLE, value: "worker" }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: RECOVER_ON_START, value: "false" }
            - { name: ENABLE_MOCK, value: "false" }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: engine-worker }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: engine-worker }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }